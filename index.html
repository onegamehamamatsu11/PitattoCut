
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Unity Web Player | ヘアーカット</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      transform: none !important;
      overflow: hidden;
      background: #000;
    }

    #unity-fullscreen-container {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      transform: none !important;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      display: block !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000;
      touch-action: none;
      outline: none;
    }

    #unity-loading-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    #unity-loading-bar {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      transform: none !important;
    }

    #unity-warning {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }

    #unity-footer {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="unity-container">

    <div id="unity-fullscreen-container">

      <canvas
        id="unity-canvas"
        width="1080"
        height="1920"
        tabindex="-1">
      </canvas>

      <div id="unity-loading-container">

        <div id="unity-loading-bar">

          <div id="unity-logo"></div>

          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>

        </div>

      </div>

    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">ヘアーカット</div>
    </div>

  </div>

  <script>
    "use strict";

    const canvas =
      document.querySelector("#unity-canvas");

    const fullscreenContainer =
      document.querySelector("#unity-fullscreen-container");

    const unityContainer =
      document.querySelector("#unity-container");

    const loadingContainer =
      document.querySelector("#unity-loading-container");

    const progressBarFull =
      document.querySelector("#unity-progress-bar-full");

    const warningBanner =
      document.querySelector("#unity-warning");


    // 画面サイズ自動調整
    function resizeUnityGame() {

      canvas.style.setProperty(
        "width",
        "100%",
        "important"
      );

      canvas.style.setProperty(
        "height",
        "100%",
        "important"
      );

      fullscreenContainer.style.setProperty(
        "width",
        "100%",
        "important"
      );

      fullscreenContainer.style.setProperty(
        "height",
        "100%",
        "important"
      );

    }


    // 端末の画面サイズ変更に対応
    window.addEventListener(
      "resize",
      resizeUnityGame
    );

    window.addEventListener(
      "orientationchange",
      resizeUnityGame
    );

    if (window.visualViewport) {

      window.visualViewport.addEventListener(
        "resize",
        resizeUnityGame
      );

    }

    resizeUnityGame();


    // Unity警告表示
    function unityShowBanner(msg, type) {

      function updateBannerVisibility() {

        warningBanner.style.display =
          warningBanner.children.length
            ? "block"
            : "none";

      }

      const div = document.createElement("div");

      div.textContent = msg;

      warningBanner.appendChild(div);

      if (type === "error") {

        div.style.cssText =
          "background:red;color:white;padding:10px;";

      } else {

        if (type === "warning") {

          div.style.cssText =
            "background:yellow;color:black;padding:10px;";

        }

        setTimeout(() => {

          if (div.parentNode) {
            div.remove();
          }

          updateBannerVisibility();

        }, 5000);

      }

      updateBannerVisibility();
    }


    // Unityビルド設定
    const buildUrl = "Build";

    const loaderUrl =
      buildUrl + "/TemplateData.loader.js";

    const config = {

      arguments: [],

      dataUrl:
        buildUrl + "/TemplateData.data.unityweb",

      frameworkUrl:
        buildUrl + "/TemplateData.framework.js.unityweb",

      codeUrl:
        buildUrl + "/TemplateData.wasm.unityweb",

      streamingAssetsUrl: "StreamingAssets",

      fullscreenElementID:
        "unity-fullscreen-container",

      companyName: "DefaultCompany",

      productName: "ヘアーカット",

      productVersion: "1.0",

      showBanner: unityShowBanner

    };


    // 端末標準の描画解像度を使用
    // 描画解像度の制限は設定しない


    // スマホ・iPadの判定
    if (/iPhone|iPad|iPod|Android/i.test(
      navigator.userAgent
    )) {

      unityContainer.className = "unity-mobile";

      canvas.className = "unity-mobile";

    }


    // Unity読み込み
    const script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {

      createUnityInstance(

        canvas,

        config,

        (progress) => {

          if (progress < 1) {

            loadingContainer.style.display = "flex";

            progressBarFull.style.width =
              (100 * progress) + "%";

          } else {

            loadingContainer.style.display = "none";

          }

        }

      ).then((unityInstance) => {

        loadingContainer.style.display = "none";

        resizeUnityGame();

        const fullscreenButton =
          document.querySelector("#unity-fullscreen-button");

        if (fullscreenButton) {

          fullscreenButton.onclick = () => {

            unityInstance.SetFullscreen(1);

          };

        }

        document.addEventListener(
          "fullscreenchange",
          resizeUnityGame
        );

      }).catch((message) => {

        unityShowBanner(
          String(message),
          "error"
        );

      });

    };

    script.onerror = () => {

      unityShowBanner(
        "Unityの読み込みに失敗しました。",
        "error"
      );

    };

    document.body.appendChild(script);

  </script>

</body>
</html>
