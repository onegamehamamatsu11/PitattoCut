
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>Unity Web Player | ヘアーカット</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    * {
      box-sizing: border-box;
    }

    #unity-container {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000;
      overflow: hidden;
    }

    #unity-fullscreen-container {
      position: absolute !important;
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000;
      touch-action: none;
      outline: none;
    }

    #unity-loading-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    #unity-loading-bar {
      position: relative;
      left: auto !important;
      top: auto !important;
      transform: none !important;
    }

    #unity-warning {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      max-width: 90%;
      text-align: center;
    }

    #unity-footer {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="unity-container" class="unity-desktop">

    <div id="unity-fullscreen-container">

      <canvas
        id="unity-canvas"
        width="1080"
        height="1920"
        tabindex="-1">
      </canvas>

      <div id="unity-loading-container">
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
      </div>

    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">ヘアーカット</div>
    </div>

  </div>

  <script>
    "use strict";

    const canvas = document.querySelector("#unity-canvas");

    const fullscreenContainer =
      document.querySelector("#unity-fullscreen-container");

    const unityContainer =
      document.querySelector("#unity-container");

    const GAME_WIDTH = 1080;
    const GAME_HEIGHT = 1920;

    const GAME_ASPECT = GAME_WIDTH / GAME_HEIGHT;

    function resizeUnityGame() {

      const availableWidth = window.innerWidth;

      const availableHeight =
        window.visualViewport
          ? window.visualViewport.height
          : window.innerHeight;

      let displayWidth;
      let displayHeight;

      const screenAspect =
        availableWidth / availableHeight;

      if (screenAspect > GAME_ASPECT) {

        displayHeight = availableHeight;

        displayWidth =
          displayHeight * GAME_ASPECT;

      } else {

        displayWidth = availableWidth;

        displayHeight =
          displayWidth / GAME_ASPECT;

      }

      fullscreenContainer.style.setProperty(
        "width",
        displayWidth + "px",
        "important"
      );

      fullscreenContainer.style.setProperty(
        "height",
        displayHeight + "px",
        "important"
      );

    }

    resizeUnityGame();

    window.addEventListener(
      "resize",
      resizeUnityGame
    );

    window.addEventListener(
      "orientationchange",
      resizeUnityGame
    );

    if (window.visualViewport) {

      window.visualViewport.addEventListener(
        "resize",
        resizeUnityGame
      );

    }

    function unityShowBanner(msg, type) {

      const warningBanner =
        document.querySelector("#unity-warning");

      function updateBannerVisibility() {

        warningBanner.style.display =
          warningBanner.children.length
            ? "block"
            : "none";

      }

      const div = document.createElement("div");

      div.textContent = msg;

      warningBanner.appendChild(div);

      if (type === "error") {

        div.style.cssText =
          "background:red;color:white;padding:10px;";

      } else {

        if (type === "warning") {

          div.style.cssText =
            "background:yellow;color:black;padding:10px;";

        }

        setTimeout(() => {

          div.remove();
          updateBannerVisibility();

        }, 5000);

      }

      updateBannerVisibility();
    }

    const buildUrl = "Build";

    const loaderUrl =
      buildUrl + "/TemplateData.loader.js";

    const config = {

      arguments: [],

      dataUrl:
        buildUrl + "/TemplateData.data.unityweb",

      frameworkUrl:
        buildUrl + "/TemplateData.framework.js.unityweb",

      codeUrl:
        buildUrl + "/TemplateData.wasm.unityweb",

      streamingAssetsUrl: "StreamingAssets",

      fullscreenElementID:
        "unity-fullscreen-container",

      companyName: "DefaultCompany",

      productName: "ヘアーカット",

      productVersion: "1.0",

      showBanner: unityShowBanner

    };

    // 端末標準の描画解像度を維持します。
    // devicePixelRatioの制限は行いません。

    if (/iPhone|iPad|iPod|Android/i.test(
      navigator.userAgent
    )) {

      unityContainer.className = "unity-mobile";

      canvas.className = "unity-mobile";

    }

    const script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {

      const loadingContainer =
        document.querySelector(
          "#unity-loading-container"
        );

      const progressBarFull =
        document.querySelector(
          "#unity-progress-bar-full"
        );

      createUnityInstance(

        canvas,

        config,

        (progress) => {

          if (progress < 1) {

            loadingContainer.style.display = "flex";

            progressBarFull.style.width =
              (100 * progress) + "%";

          } else {

            loadingContainer.style.display = "none";

          }

        }

      ).then((unityInstance) => {

        resizeUnityGame();

        const fullscreenButton =
          document.querySelector(
            "#unity-fullscreen-button"
          );

        if (fullscreenButton) {

          fullscreenButton.onclick = () => {

            unityInstance.SetFullscreen(1);

          };

        }

        document.addEventListener(
          "fullscreenchange",
          resizeUnityGame
        );

      }).catch((message) => {

        unityShowBanner(
          String(message),
          "error"
        );

      });

    };

    script.onerror = () => {

      unityShowBanner(
        "Unityの読み込みに失敗しました。",
        "error"
      );

    };

    document.body.appendChild(script);

  </script>

</body>
</html>
